<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects · The Engineers</title>
  <meta name="description" content="Explore engineering projects. Read a plan and choose a task." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="public-theme.css" />
</head>
<body class="work-page technical-page">
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="index.html">The Engineers</a>
      <nav class="nav-links" aria-label="Primary">
        <a aria-current="page" href="projects.html">Projects</a>
      </nav>
    </header>

    <main class="project-index">
      <header class="project-index-head">
        <div>
          <h1>Projects</h1>
          <p>Find a project, read the plan, and choose a task.</p>
        </div>
        <span id="project-total" role="status">Loading projects…</span>
      </header>

      <div class="project-toolbar">
        <label class="project-search">
          <span class="sr-only">Search projects</span>
          <input id="project-search" type="search" placeholder="Search projects" aria-label="Search projects" />
        </label>
        <label class="filter-field" for="project-filters">Category
          <select id="project-filters"><option value="all">All categories</option></select>
        </label>
        <label class="filter-field" for="difficulty-filter">Build difficulty
          <select id="difficulty-filter" aria-describedby="difficulty-note">
            <option value="all">All difficulties</option>
            <option value="easy">Easy · Basic tools & materials</option>
            <option value="medium">Medium · Practical experience</option>
            <option value="hard">Hard · Advanced engineering</option>
            <option value="unassessed">Not yet assessed</option>
          </select>
        </label>
        <button id="clear-filters" class="button button-secondary" type="button" disabled>Clear filters</button>
      </div>
      <p id="difficulty-note" class="difficulty-explanation">Difficulty is for the whole build. You can contribute to individual tasks.</p>
      <section class="project-list" id="project-list" aria-live="polite">
        <p class="project-empty">Loading projects…</p>
      </section>
    </main>
  </div>
  <script type="module" src="projects.js"></script>
</body>
</html>
